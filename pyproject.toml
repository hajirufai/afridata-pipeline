[project]
name = "afridata-pipeline"
version = "1.0.0"
description = "ETL pipeline & dashboard for African economic data from World Bank API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{name = "Haji Rufai", email = "mohamedrufai59@gmail.com"}]
keywords = ["data-engineering", "etl", "africa", "world-bank", "duckdb", "dashboard"]

dependencies = [
    "httpx>=0.27.0",
    "duckdb>=1.1.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/hajirufai/afridata-pipeline"
Repository = "https://github.com/hajirufai/afridata-pipeline"
